<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <!-- 375px-first: lock the viewport to device width, no user zoom drift on a
         floor phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1C1612" />
    <title>Mise</title>
    <!-- Brand fonts. Preconnect + display=swap so first paint is never blocked
         on a 4G connection; system fallbacks below keep it legible offline.
         Production note: self-host these for full offline/perf guarantees. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
