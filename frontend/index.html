<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <!-- 375px-first: lock the viewport to device width, no user zoom drift on a
         floor phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090F1A" />
    <title>Mise</title>
    <!-- Brand fonts — Deep Meridian + Pairing 01 (MIS-640, board confirmed 2026-05-29):
         Fraunces variable (display/headings, OFL), Hanken Grotesk (body/UI/data, OFL).
         Replaces Space Grotesk + Plus Jakarta Sans + IBM Plex Mono + DM Sans.
         display=swap prevents render-blocking on a 4G floor phone. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
